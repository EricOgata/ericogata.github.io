<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<script>
		localStorage.theme === 'dark' ||
			(!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
			? document.documentElement.classList.add('dark')
			: document.documentElement.classList.remove('dark');
	</script>
	<!-- SEO Essencial -->
    <meta name="description" content="Ogata - Desenvolvedor Full Stack" />
    <meta name="keywords" content="desenvolvedor, fullstack, react, nextjs, software engineer, front-end, back-end" />
    
    <!-- Open Graph (LinkedIn, Facebook, WhatsApp) -->
    <meta property="og:title" content="Ogata - Desenvolvedor Full Stack" />
    <meta property="og:description" content="Confira meu portfólio e projetos" />
    <meta property="og:url" content="https://ogata.dev" />
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div id="root"="display: contents">%sveltekit.body%</div>
</body>

</html>
